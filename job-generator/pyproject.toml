[project]
name = "job-generator"
version = "0.1.0"
description = "Job generator for Ubuntu GUI testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
job-generator = "job_generator.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pytest>=9.1.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.17",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "S108"]
